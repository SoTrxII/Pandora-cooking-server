name: Build new image and create a new release

on:
  push:
    tags:
      - "*"
jobs:
  image-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Define ENV VARS
        id: define_env
        run: echo "::set-output name=tag::${GITHUB_REF#refs/*/}"

      - name: Login to DockerHub
        if: success()
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Pin to the version the image itself runs. Without this the job takes
      # whatever the runner currently ships, which is how the 2.5.0 release
      # failed: zlib-sync builds against nan, nan does not support Node 22's v8
      # API, and npm install died compiling it. The Dockerfile has always
      # installed setup_18.x, so building deps on anything else was only ever
      # working by coincidence.
      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install deps
        run: npm install

      - name: Transpile typescript
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build and push cooking server
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pandora-cooking-server:${{ steps.define_env.outputs.tag }}

  create-release:
    needs: image-build
    runs-on: ubuntu-latest
    steps:
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
